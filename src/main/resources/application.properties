spring.application.name=Nest-Backend

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Render
server.port=${PORT:8080}

# Comma-separated browser origins. Use exact origins without a trailing slash.
app.allowed-origins=${APP_ALLOWED_ORIGINS:https://nest-frontend-blue.vercel.app,http://localhost:5173}

# Razorpay payment
# Default to safe placeholder values so the app can still boot in local/dev environments
# where the payment credentials are not configured yet.
razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_placeholder}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:placeholder_secret}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
